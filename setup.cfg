[mutmut]
# Selected tests can do most of their work in fixtures, outside mutmut's duration estimate.
timeout_constant = 10
source_paths =
    src/slopsniffer/analysis.py
    src/slopsniffer/ingest/
    src/slopsniffer/signals/
    src/slopsniffer/outcomes/
    src/slopsniffer/grading/
    src/slopsniffer/proposals/
    src/slopsniffer/report/
    src/slopsniffer/query.py
    src/slopsniffer/status.py
    src/slopsniffer/repositories.py
also_copy =
    README.md
    docs/
    schemas/
    skills/
    src/slopsniffer/__init__.py
    src/slopsniffer/__main__.py
    src/slopsniffer/py.typed
    src/slopsniffer/cli.py
    src/slopsniffer/config.py
    src/slopsniffer/contracts.py
    src/slopsniffer/db.py
    src/slopsniffer/errors.py
    src/slopsniffer/upgrade_v3.sql
    src/slopsniffer/upgrade_v4.sql
    src/slopsniffer/schema.sql
    src/slopsniffer/default_config.toml
pytest_add_cli_args_test_selection =
    tests/
pytest_add_cli_args =
    -m
    not slow
