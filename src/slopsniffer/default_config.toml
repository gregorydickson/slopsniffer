# Packaged defaults. A user config (--config, $SLOPSNIFFER_CONFIG or
# ~/.config/slopsniffer/config.toml) is merged over this file; it may only
# set keys that exist here (pricing.models accepts new model entries), and each
# value must have the type of its default.

[ingest]
workers = 4
# DuckDB buffer-pool cap, not the process total: the writer's RSS plateaus well above it
# (allocator memory DuckDB does not count, plus parsers). Finalization is per session, so
# the plateau tracks this limit rather than the corpus size; keep it a fraction of the RSS
# the ingest may use.
memory_limit = "512MB"
threads = 2
batch_rows = 5000

[ingest.sources]
crush_projects = "~/.local/share/crush/projects.json"
claude_projects = "~/.claude/projects"
codex_sessions = "~/.codex/sessions"
droid_sessions = "~/.factory/sessions"
pickle_sessions = ["~/.local/share/pickle-rick/sessions", "~/.claude/pickle-rick/sessions"]
skill_roots = ["~/.claude/skills", "~/.agents/skills", "~/.codex/skills"]
plugin_roots = ["~/.claude/plugins"]

[signals]
rerun_min = 3
churn_min = 5
abandon_window = 5
orphan_hours = 24
# Case-insensitive phrases that mark a user message as correcting the previous assistant turn.
correction_lexicon = [
    "that's wrong",
    "that is wrong",
    "that's not what",
    "not what i asked",
    "you didn't",
    "you missed",
    "i said",
    "try again",
    "undo that",
    "revert that",
    "why did you",
]

