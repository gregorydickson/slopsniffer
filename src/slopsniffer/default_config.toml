[outcomes]
rate_reserve = 1000
open_pr_ttl_hours = 6
pr_batch_size = 50
# RE2 pattern for issue-tracker keys (e.g. "PROJ-\\d+"), matched case-insensitively at word
# boundaries in branch names and in what the user and agent said; matches are stored
# upper-cased. Empty turns ticket linking off. $SLOPSNIFFER_TICKET_PATTERN overrides it.
ticket_pattern = ""

[grading]
backend = "auto"
chunk_tokens = 24000
chunk_overlap = 2000

[grading.badness_weights]
signal_severity = 1.0
ci_red_at_head = 5.0
changes_requested = 3.0
reverted = 8.0
closed_unmerged = 2.0
